name: Verify Vite security update
on:
  push:
    branches: [fix/vite-security-20261124]
    paths: ['.github/workflows/verify-vite-security.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --save-dev vite@6.4.6 --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: patched-dependencies
          path: |
            package.json
            package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  commit:
    needs: patch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-dependencies
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'Update Vite to address GHSA-p4f5-76q4-ffq7'
          git push origin HEAD:refs/heads/fix/vite-security-20261124
